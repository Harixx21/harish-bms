<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">KRG BMS Logo</title>
  <desc id="desc">Premium KRG BMS construction material monogram logo.</desc>
  <defs>
    <linearGradient id="outer" x1="22" y1="8" x2="106" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5c35b"/>
      <stop offset="0.42" stop-color="#c86a28"/>
      <stop offset="1" stop-color="#0d2f36"/>
    </linearGradient>
    <linearGradient id="gold" x1="34" y1="28" x2="94" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1ba"/>
      <stop offset="0.48" stop-color="#d99a31"/>
      <stop offset="1" stop-color="#8b4b19"/>
    </linearGradient>
    <filter id="drop" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#06191d" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#outer)"/>
  <rect x="17" y="17" width="94" height="94" rx="23" fill="#102f36"/>
  <path d="M64 24 94 39v25c0 23-12 38-30 45-18-7-30-22-30-45V39l30-15Z" fill="#163f47"/>
  <path d="M64 30 88 42v21c0 17-8 29-24 36-16-7-24-19-24-36V42l24-12Z" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>

  <g filter="url(#drop)">
    <path d="M40 77h48v15H40V77Z" fill="url(#gold)"/>
    <path d="M44 81h12m6 0h12m6 0h4M56 88h12m6 0h10" stroke="#102f36" stroke-width="2.2" stroke-linecap="round"/>
    <text x="64" y="70" text-anchor="middle"
          font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-size="30" font-weight="900" fill="#fff7d6" letter-spacing="1.8">KRG</text>
    <path d="M37 48h54" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M47 48 58 37M64 48 75 37" stroke="#fff7d6" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <text x="64" y="106" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="900" fill="#fff1ba" letter-spacing="3">BMS</text>
